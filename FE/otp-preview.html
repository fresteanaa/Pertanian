<!-- Standalone preview for Verifikasi OTP -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifikasi OTP - PehTani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ─── Main Content ─── */
    .otp-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px 80px 20px;
    }

    .otp-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ─── Header ─── */
    .otp-header {
      margin-bottom: 36px;
    }

    .otp-title {
      font-size: 34px;
      font-weight: 800;
      color: #008468;
      letter-spacing: -0.5px;
      margin: 0 0 14px 0;
    }

    .otp-subtitle {
      font-size: 14.5px;
      line-height: 1.6;
      color: #64748b;
      margin: 0;
      max-width: 480px;
    }

    /* ─── Feedback Alerts ─── */
    .otp-alert {
      display: none;
      width: 100%;
      max-width: 380px;
      padding: 10px 16px;
      font-size: 13.5px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .otp-alert-error {
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
    }

    .otp-alert-success {
      background-color: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }

    /* ─── Form & Inputs ─── */
    .otp-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .otp-inputs-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    /* 5 Square Boxes matching Design */
    .otp-box {
      width: 52px;
      height: 52px;
      border: 1px solid #71717a;
      border-radius: 2px;
      background-color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      color: #1e293b;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .otp-box:focus {
      border-color: #008468;
      box-shadow: 0 0 0 3px rgba(0, 132, 104, 0.18);
    }

    /* ─── Resend Link ─── */
    .otp-resend-wrap {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .otp-timer {
      color: #94a3b8;
      font-weight: 500;
    }

    .btn-resend-link {
      background: none;
      border: none;
      padding: 0;
      font-size: 14px;
      font-weight: 700;
      color: #008468;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
      font-family: inherit;
    }

    .btn-resend-link:hover:not(:disabled) {
      color: #006852;
    }

    .btn-resend-link:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ─── Action Button ─── */
    .otp-action-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .btn-otp-verify {
      width: 100%;
      max-width: 260px;
      height: 46px;
      padding: 0 24px;
      background-color: #008767;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.12s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-otp-verify:hover {
      background-color: #007357;
      transform: translateY(-1px);
    }

    /* ─── Page Footer ─── */
    .otp-footer {
      background-color: #00745b;
      padding: 18px 40px;
      color: rgba(255, 255, 255, 0.95);
    }

    .otp-footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1120px;
      margin: 0 auto;
      gap: 16px;
    }

    .otp-footer .footer-copy {
      font-size: 13px;
    }

    .otp-footer .footer-links {
      display: flex;
      gap: 24px;
    }

    .otp-footer .footer-links a {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .otp-footer .footer-links a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .otp-main {
        padding: 40px 16px 50px 16px;
      }

      .otp-title {
        font-size: 26px;
      }

      .otp-inputs-row {
        gap: 10px;
      }

      .otp-box {
        width: 44px;
        height: 48px;
        font-size: 22px;
      }

      .otp-resend-wrap {
        flex-direction: column;
        gap: 4px;
      }

      .btn-otp-verify {
        max-width: 100%;
      }

      .otp-footer-inner {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      .otp-footer .footer-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Main Content -->
  <main class="otp-main">
    <div class="otp-container">
      <div class="otp-header">
        <h1 class="otp-title">Masukkan Kode OTP</h1>
        <p class="otp-subtitle" id="otpSubtitle">
          Masukkan kode OTP yang telah dikirimkan ke email ra********@gmail.com
        </p>
      </div>

      <!-- Alerts -->
      <div id="otpAlertError" class="otp-alert otp-alert-error"></div>
      <div id="otpAlertSuccess" class="otp-alert otp-alert-success"></div>

      <!-- 5 Input Boxes -->
      <form class="otp-form" id="otpForm" onsubmit="handleOtpSubmit(event)">
        <div class="otp-inputs-row" id="otpBoxes">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 1" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 2" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 3" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 4" autocomplete="off" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 5" autocomplete="off" />
        </div>

        <!-- Resend Link -->
        <div class="otp-resend-wrap">
          <span>Tidak Mendapatkan OTP? </span>
          <span id="resendContainer">
            <button type="button" class="btn-resend-link" id="btnResend" onclick="handleResendOtp()">Kirim Ulang OTP</button>
          </span>
        </div>

        <!-- Submit Button -->
        <div class="otp-action-wrap">
          <button type="submit" class="btn-otp-verify">Verifikasi</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="otp-footer">
    <div class="otp-footer-inner">
      <span class="footer-copy">@2024, PEHTANI, Ramayuda Mahardika</span>
      <div class="footer-links">
        <a href="#kebijakan">Kebijakan Privasi</a>
        <a href="#syarat">Syarat dan Ketentuan</a>
        <a href="bantuan-preview.html">Bantuan &amp; Kontak</a>
      </div>
    </div>
  </footer>

  <script>
    const pendingData = sessionStorage.getItem('pending_registration');
    if (pendingData) {
      try {
        const parsed = JSON.parse(pendingData);
        if (parsed.email) {
          document.getElementById('otpSubtitle').textContent = 
            `Masukkan kode OTP yang telah dikirimkan ke email ${parsed.email}`;
        }
      } catch (e) {}
    }

    const boxes = document.querySelectorAll('.otp-box');

    if (boxes[0]) boxes[0].focus();

    boxes.forEach((box, idx) => {
      box.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val ? val.slice(-1) : '';

        hideAlerts();

        if (e.target.value && idx < boxes.length - 1) {
          boxes[idx + 1].focus();
        }
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (!box.value && idx > 0) {
            boxes[idx - 1].focus();
          }
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          boxes[idx - 1].focus();
        } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
          boxes[idx + 1].focus();
        }
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 5);
        if (!paste) return;

        paste.split('').forEach((char, i) => {
          if (boxes[i]) boxes[i].value = char;
        });

        const nextIdx = Math.min(paste.length, boxes.length - 1);
        boxes[nextIdx].focus();
      });
    });

    function hideAlerts() {
      document.getElementById('otpAlertError').style.display = 'none';
      document.getElementById('otpAlertSuccess').style.display = 'none';
    }

    function handleOtpSubmit(e) {
      e.preventDefault();
      let otpCode = '';
      boxes.forEach(b => otpCode += b.value);

      const errAlert = document.getElementById('otpAlertError');
      const succAlert = document.getElementById('otpAlertSuccess');

      if (otpCode.length < 5) {
        errAlert.textContent = 'Silakan masukkan 5 digit kode OTP dengan lengkap.';
        errAlert.style.display = 'block';
        succAlert.style.display = 'none';
        return;
      }

      errAlert.style.display = 'none';
      succAlert.textContent = 'Verifikasi Berhasil! Mengalihkan ke halaman masuk...';
      succAlert.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'login-preview.html';
      }, 1500);
    }

    let countdown = 60;
    let timerInterval = null;

    function startTimer() {
      const container = document.getElementById('resendContainer');
      container.innerHTML = `<span class="otp-timer">Kirim Ulang (${countdown}s)</span>`;
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timerInterval);
          container.innerHTML = `<button type="button" class="btn-resend-link" onclick="handleResendOtp()">Kirim Ulang OTP</button>`;
          countdown = 60;
        } else {
          container.innerHTML = `<span class="otp-timer">Kirim Ulang (${countdown}s)</span>`;
        }
      }, 1000);
    }

    function handleResendOtp() {
      const succAlert = document.getElementById('otpAlertSuccess');
      succAlert.textContent = 'Kode OTP baru telah dikirimkan ke email Anda!';
      succAlert.style.display = 'block';
      setTimeout(() => succAlert.style.display = 'none', 3500);
      startTimer();
    }
  </script>
</body>
</html>
